apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexushr-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexushr-frontend
  template:
    metadata:
      labels:
        app: nexushr-frontend
    spec:
      containers:
        - name: frontend
          image: nexushr/frontend:latest
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: nexushr-frontend
spec:
  selector:
    app: nexushr-frontend
  ports:
    - port: 80
      targetPort: 5173
